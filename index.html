<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tirgul 2</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body class="bg-white text-slate-900 dark:bg-black dark:text-slate-100">
    <div
      id="app"
      class="mx-auto flex min-h-screen max-w-250 flex-col gap-2 bg-slate-200 p-2 dark:bg-slate-800"
    >
      <header
        class="relative flex items-center justify-between bg-slate-300 p-4 dark:bg-slate-700"
      >
        <div class="flex items-center gap-4">
          <button
            id="btnMenu"
            type="button"
            class="rounded border border-slate-700 px-3 py-1 lg:hidden dark:border-slate-300"
          >
            Menu
          </button>
          <nav
            id="popUpMenu"
            class="absolute top-full left-0 z-10 hidden w-full bg-slate-300 p-4 shadow-lg lg:static lg:flex lg:w-auto lg:gap-4 lg:bg-transparent lg:p-0 lg:shadow-none dark:bg-slate-700 lg:dark:bg-transparent"
          >
            <a href="index.html" class="mr-2 block text-xl font-bold hover:underline">Home</a>
            <a href="login.html" class="mr-2 block text-xl font-bold hover:underline">Login</a>
            <a href="register.html" class="mr-2 block text-xl font-bold hover:underline">Register</a>
            <a href="userManagement.html" class="mr-2 block text-xl font-bold hover:underline">Users</a>
          </nav>
        </div>
        <button
          id="btnTheme"
          type="button"
          class="rounded border border-slate-700 px-3 py-1 dark:border-slate-300"
        >
          Light
        </button>
      </header>

      <main class="flex grow items-center justify-center bg-slate-300 p-4 dark:bg-slate-700">
        <section
          class="w-full max-w-sm rounded-xl bg-white p-8 text-center shadow-lg dark:bg-slate-800"
        >
          <h1 class="mb-2 text-2xl font-bold">Tirgul 2</h1>
          <p class="mb-6 text-slate-600 dark:text-slate-300">
            User authentication with localStorage
          </p>
          <a
            href="login.html"
            class="inline-block w-full rounded-lg bg-blue-600 py-2.5 font-semibold text-white transition hover:bg-blue-700"
          >
            Go to login
          </a>
        </section>
      </main>

      <footer class="bg-slate-300 p-4 text-center dark:bg-slate-700">Tirgul 2 &copy; 2026</footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
