<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body class="bg-white text-slate-900 dark:bg-black dark:text-slate-100">
    <div
      id="app"
      class="mx-auto flex min-h-screen max-w-250 flex-col gap-2 bg-slate-200 p-2 dark:bg-slate-800"
    >
      <header
        class="relative flex items-center justify-between bg-slate-300 p-4 dark:bg-slate-700"
      >
        <div class="flex items-center gap-4">
          <button
            id="btnMenu"
            type="button"
            class="rounded border border-slate-700 px-3 py-1 lg:hidden dark:border-slate-300"
          >
            Menu
          </button>
          <nav
            id="popUpMenu"
            class="absolute top-full left-0 z-10 hidden w-full bg-slate-300 p-4 shadow-lg lg:static lg:flex lg:w-auto lg:gap-4 lg:bg-transparent lg:p-0 lg:shadow-none dark:bg-slate-700 lg:dark:bg-transparent"
          >
            <a href="/index.html" class="mr-2 block text-xl font-bold hover:underline">Home</a>
            <a href="/src/login.html" class="mr-2 block text-xl font-bold hover:underline">Login</a>
            <a href="/src/register.html" class="mr-2 block text-xl font-bold hover:underline">Register</a>
            <a href="/src/userManagement.html" class="mr-2 block text-xl font-bold hover:underline">Users</a>
          </nav>
        </div>
        <button
          id="btnTheme"
          type="button"
          class="rounded border border-slate-700 px-3 py-1 dark:border-slate-300"
        >
          Light
        </button>
      </header>

      <main class="flex grow items-center justify-center bg-slate-300 p-4 dark:bg-slate-700">
        <section class="w-full max-w-sm rounded-xl bg-white p-8 shadow-lg dark:bg-slate-800">
          <h1 class="mb-6 text-center text-2xl font-bold">Log in</h1>

          <form id="loginForm" class="space-y-4">
            <div>
              <label for="email" class="mb-1.5 block text-sm font-semibold">Email</label>
              <!-- HTML validators: required, type=email -->
              <input
                type="email"
                id="email"
                name="email"
                required
                autocomplete="email"
                placeholder="you@example.com"
                class="peer w-full rounded-lg border border-slate-300 px-3 py-2.5 transition outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 dark:border-slate-600 dark:bg-slate-900 [&:not(:placeholder-shown):invalid]:border-red-500 [&:not(:placeholder-shown):invalid]:bg-red-50 dark:[&:not(:placeholder-shown):invalid]:bg-red-950 [&:not(:placeholder-shown):valid]:border-green-500"
              />
              <p class="mt-1 hidden text-xs text-red-600 peer-[:not(:placeholder-shown):invalid]:block">
                Please enter a valid email address.
              </p>
            </div>

            <div>
              <label for="password" class="mb-1.5 block text-sm font-semibold">Password</label>
              <!-- HTML validators: required, minlength -->
              <input
                type="password"
                id="password"
                name="password"
                required
                minlength="8"
                autocomplete="current-password"
                placeholder="At least 8 characters"
                class="peer w-full rounded-lg border border-slate-300 px-3 py-2.5 transition outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 dark:border-slate-600 dark:bg-slate-900 [&:not(:placeholder-shown):invalid]:border-red-500 [&:not(:placeholder-shown):invalid]:bg-red-50 dark:[&:not(:placeholder-shown):invalid]:bg-red-950 [&:not(:placeholder-shown):valid]:border-green-500"
              />
              <p class="mt-1 hidden text-xs text-red-600 peer-[:not(:placeholder-shown):invalid]:block">
                Password must be at least 8 characters.
              </p>
            </div>

            <button
              type="submit"
              class="w-full rounded-lg bg-blue-600 py-2.5 font-semibold text-white transition hover:bg-blue-700"
            >
              Log in
            </button>
          </form>

          <p id="message" class="mt-4 text-center text-sm" role="alert"></p>

          <p class="mt-4 text-center text-sm">
            No account?
            <a href="/src/register.html" class="text-blue-600 hover:underline dark:text-blue-400">Register</a>
          </p>
        </section>
      </main>

      <footer class="bg-slate-300 p-4 text-center dark:bg-slate-700">Tirgul 2 &copy; 2026</footer>
    </div>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/login.js"></script>
  </body>
</html>
