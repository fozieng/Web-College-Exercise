<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <!-- Tailwind CSS only: no custom stylesheet, no inline styles -->
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-100 font-sans">
  <main class="w-full max-w-sm bg-white p-8 rounded-xl shadow-lg">
    <h1 class="mb-6 text-2xl font-bold text-center">Create account</h1>

    <form action="#" method="post" class="space-y-4">
      <div>
        <label for="name" class="block mb-1.5 text-sm font-semibold">Full name</label>
        <input type="text" id="name" name="name" required minlength="2" autocomplete="name"
               placeholder="Jane Doe"
               class="w-full px-3 py-2.5 border border-gray-300 rounded-lg outline-none transition
                      focus:border-blue-500 focus:ring-2 focus:ring-blue-200
                      [&:not(:placeholder-shown):invalid]:border-red-500 [&:not(:placeholder-shown):invalid]:bg-red-50
                      [&:not(:placeholder-shown):valid]:border-green-500">
      </div>

      <div>
        <label for="email" class="block mb-1.5 text-sm font-semibold">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email"
               placeholder="you@example.com"
               class="w-full px-3 py-2.5 border border-gray-300 rounded-lg outline-none transition
                      focus:border-blue-500 focus:ring-2 focus:ring-blue-200
                      [&:not(:placeholder-shown):invalid]:border-red-500 [&:not(:placeholder-shown):invalid]:bg-red-50
                      [&:not(:placeholder-shown):valid]:border-green-500">
      </div>

      <div>
        <label for="password" class="block mb-1.5 text-sm font-semibold">Password</label>
        <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password"
               placeholder="At least 8 characters"
               class="w-full px-3 py-2.5 border border-gray-300 rounded-lg outline-none transition
                      focus:border-blue-500 focus:ring-2 focus:ring-blue-200
                      [&:not(:placeholder-shown):invalid]:border-red-500 [&:not(:placeholder-shown):invalid]:bg-red-50
                      [&:not(:placeholder-shown):valid]:border-green-500">
      </div>

      <div>
        <label for="confirm" class="block mb-1.5 text-sm font-semibold">Confirm password</label>
        <input type="password" id="confirm" name="confirm" required minlength="8" autocomplete="new-password"
               placeholder="Repeat password"
               class="w-full px-3 py-2.5 border border-gray-300 rounded-lg outline-none transition
                      focus:border-blue-500 focus:ring-2 focus:ring-blue-200
                      [&:not(:placeholder-shown):invalid]:border-red-500 [&:not(:placeholder-shown):invalid]:bg-red-50
                      [&:not(:placeholder-shown):valid]:border-green-500">
      </div>

      <button type="submit"
              class="w-full py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold transition">
        Register
      </button>
    </form>

    <p class="mt-4 text-sm text-center">Already registered?
      <a href="login.html" class="text-blue-600 hover:underline">Log in</a>
    </p>
  </main>
</body>
</html>
