<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <!-- Step 1: built-in CSS -->
  <link rel="stylesheet" href="login.css">

  <!-- Step 2: Tailwind CSS (used for validation feedback) -->
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
</head>
<body>
  <main class="login-card">
    <h1>Log in</h1>

    <form action="#" method="post">
      <div class="mb-4">
        <label for="email">Email</label>
        <!-- HTML validators: required, type=email -->
        <input
          type="email" id="email" name="email"
          placeholder="you@example.com"
          required autocomplete="email"
          class="outline-none transition
                 focus:border-blue-500 focus:ring-2 focus:ring-blue-200
                 [&:not(:placeholder-shown):invalid]:border-red-500
                 [&:not(:placeholder-shown):invalid]:bg-red-50
                 [&:not(:placeholder-shown):valid]:border-green-500">
        <p class="hidden mt-1 text-xs text-red-600
                  [input:not(:placeholder-shown):invalid+&]:block">
          Please enter a valid email address.
        </p>
      </div>

      <div class="mb-6">
        <label for="password">Password</label>
        <!-- HTML validators: required, minlength -->
        <input
          type="password" id="password" name="password"
          placeholder="At least 8 characters"
          required minlength="8" autocomplete="current-password"
          class="outline-none transition
                 focus:border-blue-500 focus:ring-2 focus:ring-blue-200
                 [&:not(:placeholder-shown):invalid]:border-red-500
                 [&:not(:placeholder-shown):invalid]:bg-red-50
                 [&:not(:placeholder-shown):valid]:border-green-500">
        <p class="hidden mt-1 text-xs text-red-600
                  [input:not(:placeholder-shown):invalid+&]:block">
          Password must be at least 8 characters.
        </p>
      </div>

      <button type="submit">Log in</button>
    </form>

    <p class="link">No account? <a href="register.html" class="text-blue-600 hover:underline">Register</a></p>
  </main>
</body>
</html>
